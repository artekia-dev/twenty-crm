name: Build and publish the application image

# Builds the fork into a container image and publishes it to GHCR, then asks
# Coolify to redeploy.
#
# The build does NOT run on the server on purpose. Building the frontend asks
# for an 8 GB heap (see NODE_OPTIONS in packages/twenty-docker/twenty/Dockerfile),
# which on the Coolify box would compete for memory with the very instance it is
# meant to replace. Here it runs on a disposable runner and the server only ever
# pulls a finished image.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is what the compose file follows; the sha tag is what you
          # roll back to when latest turns out to be a bad idea.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          # Server and frontend in one image, the same shape the official
          # twentycrm/twenty image has. Server and worker both run it.
          target: twenty
          # Match the machine that will run it: linux/arm64 for Graviton.
          # Check with `uname -m` on the box — x86_64 means amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ask Coolify to redeploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "No COOLIFY_WEBHOOK secret set — image published, redeploy it yourself."
            exit 0
          fi
          curl -fsS -X GET "$COOLIFY_WEBHOOK" \
            ${COOLIFY_TOKEN:+-H "Authorization: Bearer $COOLIFY_TOKEN"}
